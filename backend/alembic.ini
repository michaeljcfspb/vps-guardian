[alembic]
# Caminho das migrations relativas a este arquivo.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# A URL de conexão NÃO é colocada aqui: ela vem de GUARDIAN_DATABASE_URL
# (variável de ambiente), conforme PRD §11 (nenhum segredo versionado).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
