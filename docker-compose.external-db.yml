# VPS Guardian — API apenas, usando o MySQL JÁ EXISTENTE do Easypanel
#
# Use quando o banco é um serviço MySQL gerenciado pelo Easypanel (rede privada).
# No .env, preencha GUARDIAN_DB_HOST / PORT / NAME / USER / PASSWORD com os dados
# internos do serviço (ou GUARDIAN_DATABASE_URL completa).
#
#   docker compose -f docker-compose.external-db.yml up -d --build
#
# Nenhum MySQL é criado por este arquivo.

name: vps-guardian

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vps-guardian/api:0.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GUARDIAN_APP_ENV: production
      GUARDIAN_AUTO_MIGRATE: "true"
      # Não entregar a senha de root do banco ao container da aplicação.
      MYSQL_ROOT_PASSWORD: ""
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vps-guardian/frontend:0.1.0
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Destino de /api dentro do nginx. No Easypanel (App), use o nome do serviço da API.
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    expose:
      - "80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: vps-guardian/api:0.1.0
    profiles: ["tools"]
    restart: "no"
    env_file:
      - .env
    environment:
      GUARDIAN_AUTO_MIGRATE: "false"
    command: ["alembic", "upgrade", "head"]
    security_opt:
      - no-new-privileges:true
