[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-guardian-agent"
version = "0.2.0"
description = "Agente de coleta do VPS Guardian para hosts Linux"
requires-python = ">=3.10"
dependencies = [
    # Única dependência externa: leitura de CPU, memória, disco, rede e uptime.
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.15.2",
]

[project.scripts]
guardian-agent = "guardian_agent.main:main"

[tool.setuptools.packages.find]
include = ["guardian_agent*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["unit: testes que não acessam a rede nem o sistema real"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
