# VPS Guardian — serviços da central (Easypanel)
#
# MySQL NÃO está neste compose: o banco é o serviço MySQL do Easypanel, acessível pela
# rede privada do projeto (PRD §8.2, §17.2.8). Nunca publique a porta 3306.
#
# Uso:
#   docker compose -f docker-compose.yml run --rm migrations
#   docker compose -f docker-compose.yml up -d api
#
# As variáveis vêm de um arquivo .env NÃO versionado (veja .env.example na raiz).

name: vps-guardian

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: vps-guardian/api:0.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GUARDIAN_APP_ENV: production
      GUARDIAN_LOG_JSON: "true"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Job de migração: executa uma vez e encerra. Rode antes de subir a API.
  migrations:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: vps-guardian/api:0.1.0
    profiles: ["tools"]
    restart: "no"
    env_file:
      - .env
    environment:
      GUARDIAN_APP_ENV: production
    command: ["alembic", "upgrade", "head"]
    security_opt:
      - no-new-privileges:true

  # Worker: habilitado a partir da fase 9 (alertas/fila). Mantido comentado para não
  # sugerir funcionalidade inexistente.
  #
  # worker:
  #   image: vps-guardian/api:0.1.0
  #   command: ["python", "-m", "app.worker"]
  #   restart: unless-stopped
  #   env_file: [.env]
